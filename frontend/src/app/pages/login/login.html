<div class="login-container navy-bg">
  <div class="glass-card login-card">
    <div class="text-center mb-3">
      <img src="assets/logo.png" alt="GoTravel Logo" style="width: 130px; height: 130px; border-radius: 18px; object-fit: contain; background: #0F172A; padding: 6px; border: 1.5px solid #D4A853; margin-bottom: 12px;">
    </div>
    <h1 class="gold-gradient-text text-center">Gestión de Reservas</h1>
    <h3 class="text-center mb-4 text-white">Iniciar Sesión</h3>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Correo Electrónico</mat-label>
        <input matInput formControlName="email" type="email">
      </mat-form-field>
      
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Contraseña</mat-label>
        <input matInput formControlName="password" type="password">
      </mat-form-field>

      <button mat-raised-button class="gold-button w-100 mt-3" type="submit" [disabled]="loginForm.invalid">
        Ingresar
      </button>

      <div class="text-center mt-3">
        <a routerLink="/forgot-password" class="gold-text">¿Olvidé mi contraseña?</a>
      </div>
    </form>
  </div>
</div>
