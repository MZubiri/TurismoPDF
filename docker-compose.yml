services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5020
      - ADMIN_EMAIL=admin@toursgotravel.com
      - ADMIN_PASSWORD=Admin123!
    volumes:
      - backend-data:/app/data
      - backend-pdfs:/app/pdfs
    networks:
      - gotravel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    networks:
      - gotravel-net

networks:
  gotravel-net:

volumes:
  backend-data:
  backend-pdfs:
